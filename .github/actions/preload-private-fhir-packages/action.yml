name: Pre-load private FHIR packages from npm.cognovis.de
description: >
  Authenticates against npm.cognovis.de and pre-loads private FHIR packages into the
  FHIR package cache (~/.fhir/packages/) so SUSHI and the IG Publisher can resolve
  them without hitting the public FHIR package registries (which return 404 for private packages).

  The repository helper derives direct private de.cognovis.* dependencies and
  their versions from sushi-config.yaml, then recursively caches their private
  dependency closure. This keeps CI in sync with declared package pins.

inputs:
  verdaccio-token:
    description: Authentication token for npm.cognovis.de (Verdaccio)
    required: true

runs:
  using: composite
  steps:
    - name: Fetch declared private packages into FHIR cache
      shell: bash
      env:
        VERDACCIO_TOKEN: ${{ inputs.verdaccio-token }}
      run: |
        bash scripts/preload-private-fhir-packages.sh sushi-config.yaml
